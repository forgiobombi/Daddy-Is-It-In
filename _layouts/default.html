<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="{{ site.data.brand.favicon | relative_url }}" type="image/svg+xml" />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
    {% seo %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": {{ site.title | jsonify }},
        "description": {{ site.description | jsonify }},
        "url": {{ site.url | append: site.baseurl | jsonify }}
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      {% include logo.html %}
      <nav aria-label="Primary">
        <ul class="nav-grid">
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/people/' | relative_url }}">People</a></li>
          <li><a href="{{ '/stories/' | relative_url }}">Stories</a></li>
          <li><a href="{{ '/locations/' | relative_url }}">Locations</a></li>
          <li><a href="{{ '/events/' | relative_url }}">Events</a></li>
          <li><a href="{{ '/galleries/' | relative_url }}">Galleries</a></li>
          <li><a href="{{ '/eras/' | relative_url }}">Eras</a></li>
          <li><a href="{{ '/timeline/' | relative_url }}">Timeline</a></li>
          <li><a href="{{ '/media/' | relative_url }}">Media</a></li>
          <li><a href="{{ '/search/' | relative_url }}">Search</a></li>
        </ul>
      </nav>
    </header>
    <main id="main" class="container">{{ content }}</main>
    <footer class="site-footer">
      <p>Archive project for research and documentation. Validate and cite all claims.</p>
    </footer>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
