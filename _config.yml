title: Daddy Is It? Underground Archive
email: archive@example.com
description: >-
  Dark historical-style archive documenting biographies, timelines, stories, places,
  media, and cultural context across eras and cities.
baseurl: ""
url: ""
markdown: kramdown
theme: null
permalink: /:collection/:name/
collections:
  people:
    output: true
    permalink: /people/:name/
  stories:
    output: true
    permalink: /stories/:name/
  locations:
    output: true
    permalink: /locations/:name/
  galleries:
    output: true
    permalink: /galleries/:name/
  events:
    output: true
    permalink: /events/:name/
  eras:
    output: true
    permalink: /eras/:name/
  timeline:
    output: true
    permalink: /timeline/:name/
  media:
    output: true
    permalink: /media/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: "entry"
      image: /assets/images/logo-placeholder.svg
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
exclude:
  - Gemfile
  - Gemfile.lock
